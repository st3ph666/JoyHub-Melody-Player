name: Refactor JoyHub Melody Player v2.5.4

on:
  push:
    paths:
      - '.github/workflows/refactor-v254.yml'
      - 'tools/refactor_v254.py'

permissions:
  contents: write

jobs:
  refactor:
    if: "!contains(github.event.head_commit.message, '[skip refactor-v254]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refactor source
        run: python3 tools/refactor_v254.py
      - name: Compile modules
        run: python3 -m compileall -q src/joyhub_melody JoyHub-Melody-Player-v2.5.4.py
      - name: Verify no French source comments remain
        run: |
          python3 - <<'PY'
          import io, re, tokenize
          from pathlib import Path
          french = re.compile(r"[àâçéèêëîïôûùüÿœ]|\\b(afin|ajoute|aucun|avec|avant|choisir|commande|connexion|dossier|début|défile|écran|fichier|fenêtre|grille|lancement|lecture|même|moteur|nom|pour|priorité|retourne|script|sélection|supprime|uniquement|vidéo|vibration|lorsque|automatique|arrêt|réglage|langue)\\b", re.I)
          bad=[]
          for p in Path('src/joyhub_melody').glob('*.py'):
              text=p.read_text(encoding='utf-8')
              for tok in tokenize.generate_tokens(io.StringIO(text).readline):
                  if tok.type == tokenize.COMMENT and french.search(tok.string):
                      bad.append(f'{p}:{tok.start[0]}:{tok.string}')
          if bad:
              raise SystemExit('\n'.join(bad))
          PY
      - name: Remove compile caches
        run: find . -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Commit modular v2.5.4
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refactor v2.5.4 into modules with uv deployment [skip refactor-v254]'
          git push
