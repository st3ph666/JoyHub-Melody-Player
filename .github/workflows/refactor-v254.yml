name: Finalize JoyHub Melody Player v2.5.4

on:
  push:
    paths:
      - '.github/workflows/refactor-v254.yml'
      - 'tools/finalize_v254.py'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tkinter for validation
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Finalize source cleanup
        run: python3 tools/finalize_v254.py
      - name: Compile modules
        run: python3 -m compileall -q src/joyhub_melody JoyHub-Melody-Player-v2.5.4.py
      - name: Verify imports
        run: PYTHONPATH=src python3 -c 'import joyhub_melody.main'
      - name: Remove compile caches
        run: find . -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Commit finalized v2.5.4
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Finalize v2.5.4 modular uv migration'
          git push
